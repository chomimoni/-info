<style>
:root{--bg:#F4F8FE;--ink:#10264F;--sub:#62728F;--line:#DCE6F5;--card:#fff;--hl:#FFD93B;--blue:#2F7BF5;--teal:#2F7BF5;--navy:#0E2A5C;--red:#D8452B;--sh:0 6px 20px rgba(47,123,245,.10)}
*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
.pic{cursor:zoom-in}
#zoom{position:fixed;inset:0;background:rgba(8,18,40,.92);display:none;align-items:center;justify-content:center;z-index:20;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.7 "Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif}
h1,h2{line-height:1.3;margin:0}
h1{font-size:24px;font-weight:900;margin:8px 0 14px}
h2{font-size:17px;font-weight:900;margin:22px 0 10px}
.logo{font-size:22px;font-weight:900;color:var(--ink);background:linear-gradient(transparent 62%,var(--hl) 62%,var(--hl) 88%,transparent 88%);padding:0 4px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;font-size:11px;font-weight:700;color:var(--sub);text-decoration:none;border-radius:12px}
.nav a.on{color:var(--blue)}
.brand{display:none}
.top{display:flex;align-items:center;justify-content:space-between;max-width:1000px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 0}
.back{color:var(--blue);font-weight:700;text-decoration:none}
main{max-width:1000px;margin:0 auto;padding:10px 16px 100px;animation:up .25s ease-out}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media(min-width:900px){

.nav a{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;min-height:46px;font-size:15px;color:#cfe0ff}
.nav a.on{background:var(--blue);color:#fff}
.brand{display:block;margin-bottom:24px}.brand .logo{color:#fff}
.body{margin-left:210px}.top .mob{display:none}main{padding-bottom:40px}}
.sbar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:26px;padding:0 16px;margin-bottom:14px;color:var(--sub)}
.sbar input,.srch{border:0;outline:0;background:none}
.srch{width:100%;min-height:48px;border:1px solid var(--line);border-radius:26px;padding:0 18px;background:#fff;margin-bottom:12px}
.hero{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:24px 22px;border-radius:22px;color:#fff;text-decoration:none;background:linear-gradient(120deg,#2A64E0,#5BA8FF);box-shadow:var(--sh);overflow:hidden}

.hchips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px}

.dg{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}

.dg .dt{flex:none;font-weight:900;line-height:1.3}.dg .dt small{display:block;color:var(--blue);font-weight:900}
.dg .cs{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}

.gh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px;font-weight:900}

.cols{display:grid;gap:0}
@media(min-width:900px){.cols{grid-template-columns:1.6fr 1fr;gap:14px}}

.item,.up,.row{display:flex;color:inherit;text-decoration:none}

h2+.item{border-top:0}
.ico{flex:none;width:52px;height:52px;border-radius:14px;background:#EAF2FF;color:var(--ac,var(--blue));display:grid;place-items:center}
.tx{min-width:0}.tx p{margin:2px 0;font-weight:700;line-height:1.5}.tx small{color:var(--sub)}

.up{justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-weight:900}

.tip .ttl{margin:0 0 6px;font-size:19px;font-weight:900;line-height:1.45}
.tip .ttl+.body{font-size:15.5px;color:#2b3c5c}
.tx .sn{font-weight:500;color:var(--sub);font-size:13px;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wtop{display:flex;gap:8px;margin:12px 0 4px}
mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--sub);font-size:13px;margin:0 0 10px}
.meta a{color:var(--blue)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
button,select,input,textarea{font:inherit}
.acts button,.chip,.btn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-weight:700;cursor:pointer}
.acts .cf.on{background:var(--blue);border-color:var(--blue);color:#fff}
.btn{background:var(--blue);border-color:var(--blue);color:#fff;width:100%;border-radius:24px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chip{white-space:nowrap;min-height:38px;border-radius:19px}.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
form.card,details{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:14px;margin-bottom:14px}
summary{font-weight:700;cursor:pointer;min-height:28px}
label{display:block;font-size:14px;font-weight:700;margin:10px 0 4px}
input,select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.sbar input{min-height:48px;padding:0}
textarea{min-height:84px}
.sub{color:var(--sub);font-size:14px}.empty{color:var(--sub);padding:12px 0}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));min-height:52px;padding:0 20px;border:0;border-radius:26px;background:var(--hl);color:var(--ink);font-weight:900;box-shadow:0 4px 14px rgba(16,38,79,.28);cursor:pointer;z-index:4}
@media(min-width:900px){.fab{bottom:24px}}
.auth{max-width:420px;margin:0 auto;padding:48px 16px}
.auth h1{font-size:40px;margin-bottom:4px}
.link{background:none;border:0;color:var(--blue);font-weight:700;text-decoration:underline;margin-top:12px;cursor:pointer;min-height:44px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--red);color:#fff;border-radius:12px;padding:12px 14px;font-weight:700;display:none;z-index:9}
.pic{display:block;width:100%;border-radius:12px;margin:6px 0 10px;background:#EAF2FF;min-height:40px}
.cms{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.cm{margin:4px 0;font-size:14px}.cm small{color:var(--sub)}
.x{border:0;background:none;color:var(--sub);cursor:pointer;min-width:32px;min-height:32px}
.cmf{display:flex;gap:8px;margin-top:6px}
.opts{display:grid;gap:10px;margin:12px 0}
.opt{min-height:52px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-weight:700;text-align:left;padding:10px 14px;cursor:pointer}
.opt.on{border-color:var(--blue);background:#EAF2FF}.opt.ok{border-color:#1E9E5A;background:#E3F6EC}.opt.ng{border-color:var(--red);background:#FDE6E1}
.qb{padding:16px;font-size:17px;font-weight:700;line-height:2}
.blank{display:inline-block;width:7em;min-height:36px;margin:0 4px;vertical-align:middle}
.res.ok h2{color:#1E9E5A;border-color:#1E9E5A}.res.ng h2{color:var(--red);border-color:var(--red)}
.lnk{display:flex;align-items:center;justify-content:center;text-decoration:none;min-height:48px}
.big2{font-size:32px;font-weight:900;margin:14px 0}
.ql{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
h2+.ql{border-top:0}
.ql .qt{min-width:0}.ql .qt p{margin:0;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ql .qt small{color:var(--sub)}
.mk{font-weight:900}.mk.ok{color:#1E9E5A}.mk.ng{color:var(--red)}
.tag.warn{background:#FFF3C4;color:#8A6400}
.seq{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;min-height:30px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>

<body>

<script>
// ▼ Supabaseの「Project Settings → API」にある値に書き換えてください
const SB_URL = 'https://eejbkxvhoerlvdekdced.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlamJreHZob2VybHZkZWtkY2VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyMjk4OTYsImV4cCI6MjEwOTgwNTg5Nn0.JaPKca7QH4KR2GsZ8xYXPyxWlyOOJmYb8OFKK5LNF30';

const sb = supabase.createClient(SB_URL, SB_KEY);
const VAPID_PUB = 'BGQLcgZDJ48XSsl4hJX9RQN9fOGd7F3lvHcDrmAuArMfLxAfrrv-A6owY-Upmp4uWHK-H3EV6xe66NwOkZkkQbg';
let pushOn = false;
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null, authMode = 'login', unitF = '', sortBy = 'new', lastSource = '先生の発言';
let st = { subjects: [], tips: [], conf: [], cm: [], qs: [], att: [], qst: [], rep: [] };

function toast(msg, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block'; t.style.background = ok ? 'var(--blue)' : 'var(--red)';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 4000);
}
function daysLeft(d) {
  if (!d) return null;
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.round((new Date(d + 'T00:00:00') - t) / 864e5);
}
const ac = id => `hsl(${(id * 67) % 360} 55% 42%)`;
const per = s => s.exam_period ? `${s.exam_period}限 ` : '';
const perOpts = v => '<option value="">時限なし</option>' + [1, 2, 3, 4].map(n => `<option value="${n}" ${+v === n ? 'selected' : ''}>${n}限</option>`).join('');
const byPer = (a, b) => (a.exam_period || 99) - (b.exam_period || 99);
const fmt = s => new Date(s).toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' });

async function load() {
  const [a, b, c, d, e, f, g, h] = await Promise.all([
    sb.from('subjects').select('*').order('name'),
    sb.from('tips').select('*, profiles!author_id(display_name)').order('created_at', { ascending: false }),
    sb.from('tip_confirmations').select('*'),
    sb.from('comments').select('*, profiles!author_id(display_name)').order('created_at'),
    sb.from('questions').select('*').order('created_at'),
    sb.from('attempts').select('id, question_id, correct, created_at').eq('user_id', me.id).order('created_at'),
    sb.from('question_stats').select('*'),
    sb.from('question_reports').select('*, profiles!reporter_id(display_name)').order('created_at')
  ]);
  const err = [a, b, c, d, e, f, g, h].map(x => x.error).find(Boolean);
  if (err) throw err;
  st = { subjects: a.data, tips: b.data, conf: c.data, cm: d.data, qs: e.data, att: f.data, qst: g.data, rep: h.data };
}

const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const b64u = s => { const b = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(async reg => {
    const s = 'PushManager' in window ? await reg.pushManager.getSubscription() : null;
    pushOn = !!s; if (me && location.hash === '#/me') route();
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && typeof e.data.url === 'string') location.hash = e.data.url || '#/'; });
}
async function togglePush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window))
    throw new Error(isIOS && !standalone ? 'iPhoneでは、ホーム画面に追加した「ヤマはる」のアイコンから開くと、通知をオンにできます' : 'この端末・ブラウザは通知に対応していません');
  if (pushOn) {
    const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
    if (sub) { await sb.rpc('delete_push', { p_endpoint: sub.endpoint }); await sub.unsubscribe(); }
    pushOn = false; toast('通知をオフにしました', true); return route();
  }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error('通知が許可されませんでした。iPhoneの「設定」→「通知」→「ヤマはる」から許可できます');
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID_PUB) });
  const j = sub.toJSON();
  const r = await sb.rpc('save_push', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
  if (r.error) throw r.error;
  pushOn = true; toast('通知をオンにしました', true); route();
}
async function testPush() {
  const { data, error } = await sb.functions.invoke('send-push', { body: { type: 'test' } });
  if (error) throw new Error('テスト通知を送れませんでした：' + error.message);
  toast(data && data.sent ? 'テスト通知を送りました。数秒で届きます' : '送信先がありません。先に通知をオンにしてください', !!(data && data.sent));
}
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { me = null; return route(); }
  const { data: p } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if (!p) { me = null; toast('アカウント情報が見つかりません。もう一度ログインしてください'); return route(); }
  me = p;
  try { await load(); } catch (e) { toast(e.message); }
  route();
}

let searchQ = '';
const IC = {
  home: '<path d="M3 11l9-8 9 8v10H3z"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  pen: '<path d="M4 20l4-1 11-11-3-3L5 16z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  chk: '<path d="M5 12l5 5 9-10"/>',
  quiz: '<circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5h.01"/>'
};
const svg = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const NAV = [['#/', 'home', 'ホーム'], ['#/subjects', 'list', 'テスト一覧'], ['#/write', 'pen', '投稿する'], ['#/q', 'quiz', '問題'], ['#/me', 'user', 'マイページ']];
const md = d => { const x = new Date(d + 'T00:00:00'); return `${x.getMonth() + 1}/${x.getDate()} (${'日月火水木金土'[x.getDay()]})`; };
const ago = s => { const m = (Date.now() - new Date(s)) / 6e4; return m < 60 ? `${Math.max(1, Math.round(m))}分前` : m < 1440 ? `${Math.round(m / 60)}時間前` : `${Math.round(m / 1440)}日前`; };
const live = () => st.subjects.filter(x => !x.archived);
const archivedIds = () => new Set(st.subjects.filter(x => x.archived).map(x => x.id));
const liveQ = q => !archivedIds().has(q.subject_id);
const subName = id => (st.subjects.find(s => s.id === id) || {}).name || '';
const cnt = t => st.conf.filter(c => c.tip_id === t.id).length;
function item(t) {
  return `<a class="item" href="#/s/${t.subject_id}" style="--ac:${ac(t.subject_id)}"><div class="ico">${svg('chk', 26)}</div><div class="tx"><span class="tag">${esc(t.source)}</span>${t.needs_correction ? '<span class="tag red">訂正あり</span>' : ''}<p>${esc(t.title || t.body)}</p>${t.title && t.body ? `<p class="sn">${esc(t.body)}</p>` : ''}<small>${esc(subName(t.subject_id))} / ${ago(t.created_at)} / 確認 ${cnt(t)} / コメント ${st.cm.filter(c => c.tip_id === t.id).length}</small></div></a>`;
}

function route() {
  if (!me) return authView();
  const h = location.hash.slice(2);
  if (h.startsWith('s/')) return subjectView(+h.slice(2));
  if (h.startsWith('q/')) return playView(h.slice(2));

const urlCache = {};
async function hydrate() {

  if (need.length) {

    (data || []).forEach(x => { if (x.signedUrl) urlCache[x.path] = x.signedUrl; });
  }

}
async function upImg(file) {
  if (!file || !file.size) return null;
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1200 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.75));
  const path = `${me.id}/${Date.now()}.jpg`;
  const { error } = await sb.storage.from('images').upload(path, blob, { contentType: 'image/jpeg' });
  if (error) throw error;
  return path;
}

const KINDS = {
  single: ['単一選択', '選択肢を1行ずつ書き、正解の行の先頭に * を付けます'],
  multi: ['複数選択', '選択肢を1行ずつ書き、正解すべての先頭に * を付けます'],
  tf: ['正誤（○×）', '正解を ○ か × の1文字で書きます'],
  fill: ['穴埋め', '問題文の答えにしたい部分を［ ］で囲みます。別解は／で区切ります（例：［寛骨／かんこつ］）。この欄は空でOK'],
  order: ['並べ替え', '正しい順番に1行ずつ書きます'],
  match: ['マッチング', '1行に「左＝右」の形で書きます（2行以上）'],
  word: ['単語', '正解の単語を書きます。別解は1行ずつ追加するか、／で区切ります']
};
const nz = s => String(s ?? '').normalize('NFKC').replace(/\s+/g, '').toLowerCase().replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const alts = a => String(a).split(/[／/|｜]/).map(x => x.trim()).filter(Boolean);
const shuf = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
const BR = /[［\[]([^］\]]+)[］\]]/g;
function parseQ(kind, body, data) {
  const L = data.split('\n').map(s => s.trim()).filter(Boolean);
  const err = m => { throw new Error(m); };
  if (kind === 'single' || kind === 'multi') {
    const ch = L.map(s => s.replace(/^[*＊]\s*/, '')), ans = L.map((s, i) => /^[*＊]/.test(s) ? i : -1).filter(i => i >= 0);
    if (ch.length < 2) err('選択肢を2つ以上書いてください');
    if (!ans.length || (kind === 'single' && ans.length !== 1)) err(kind === 'single' ? '正解の先頭に * を1つだけ付けてください' : '正解の先頭に * を付けてください');
    return { choices: ch, answer: ans };
  }
  if (kind === 'tf') {
    const v = (L[0] || '').replace(/^[oO〇◯]$/, '○').replace(/^[xX✕]$/, '×');
    if (!['○', '×'].includes(v)) err('正解は ○ か × で書いてください');
    return { choices: null, answer: v };
  }
  if (kind === 'fill') {
    const a = [...body.matchAll(BR)].map(m => m[1].trim());
    if (!a.length) err('問題文の答えにしたい部分を［ ］で囲んでください');
    return { choices: null, answer: a };
  }
  if (kind === 'order') { if (L.length < 2) err('2行以上書いてください'); return { choices: L, answer: L }; }
  if (kind === 'match') {
    const p = L.map(s => s.split(/[＝=]/).map(x => x.trim()));
    if (p.length < 2 || p.some(x => x.length !== 2 || !x[0] || !x[1])) err('「左＝右」の形で2行以上書いてください');
    return { choices: p, answer: p };
  }
  if (!L.length) err('正解の単語を書いてください');
  return { choices: null, answer: L };
}
const anyOrder = q => q.kind === 'fill' && !!(q.choices && q.choices.anyOrder);
const corr = q => {
  const a = JSON.parse(q.answer);
  return q.kind === 'single' || q.kind === 'multi' ? a.map(k => q.choices[k]).join('、')
    : q.kind === 'tf' ? a : q.kind === 'order' ? a.join(' → ')
    : q.kind === 'match' ? a.map(p => p.join('＝')).join('、') : q.kind === 'word' ? a.flatMap(alts).join(' / ') : a.map(x => alts(x).join(' / ')).join('、') + (anyOrder(q) ? '（順不同）' : '');
};
function judge(vals) {
  const q = play.list[play.i], ans = JSON.parse(q.answer), p = play.pick;
  let ok;
  if (q.kind === 'single' || q.kind === 'multi') ok = p.length === ans.length && p.every(k => ans.includes(k));
  else if (q.kind === 'tf') ok = ['○', '×'][p[0]] === ans;
  else if (q.kind === 'order') ok = p.length === ans.length && p.every((k, j) => play.shuf[k] === ans[j]);
  else if (q.kind === 'fill') {
    const hit = (a, v) => alts(a).some(x => nz(v) === nz(x));
    if (!anyOrder(q)) ok = ans.every((a, j) => hit(a, vals['b' + j]));
    else {
      const inp = ans.map((_, j) => vals['b' + j]), used = [];
      const go = j => j === inp.length || ans.some((a, k) => !used[k] && hit(a, inp[j]) && (used[k] = true, go(j + 1) || (used[k] = false)));
      ok = go(0);
    }
  }
  else if (q.kind === 'word') ok = ans.flatMap(alts).some(a => nz(a) === nz(vals.w));
  else ok = ans.every(([, rr], j) => vals['m' + j] === rr);
  play.res = { ok }; if (ok) play.score++; else play.miss.push(q);
  record(q, ok);
}
async function record(q, ok) {
  const r = await sb.from('attempts').insert({ question_id: q.id, correct: ok }).select('id, question_id, correct, created_at').single();
  if (r.error) return toast(r.error.message);
  st.att.push(r.data); if (play) play.attId = r.data.id;
}
const lastAtt = qid => { for (let k = st.att.length - 1; k >= 0; k--) if (st.att[k].question_id === qid) return st.att[k]; return null; };
const isWrong = q => { const a = lastAtt(q.id); return !!a && !a.correct; };
const rate = q => { const s = st.qst.find(x => x.question_id === q.id); return s && s.n ? { n: s.n, p: Math.round(s.ok * 100 / s.n) } : null; };
const repsOf = q => st.rep.filter(r => r.question_id === q.id);
const canQ = q => q.author_id === me.id || me.is_admin;
const qText = q => q.body.replace(/[［\[]([^］\]]+)[］\]]/g, '（　）');

let qEditId = null, lastMiss = [];
function qView() {
  const wrong = st.qs.filter(q => liveQ(q) && isWrong(q));
  const arc = st.subjects.filter(x => x.archived);
  const qrow = s => {
    const qs = st.qs.filter(q => q.subject_id === s.id), w = qs.filter(isWrong).length;
    return `<a class="row" style="--ac:${ac(s.id)}" href="#/q/${s.id}"><span>${esc(s.name)}${w ? ` <span class="tag red">間違い${w}</span>` : ''}</span><span class="d ${qs.length ? '' : 'off'}">${qs.length}問 ›</span></a>`;
  };
  const rows = live().map(qrow).join('');
  shell(`<h1>問題</h1><button class="btn" data-act="newq" style="margin-bottom:14px">＋ 問題を作る</button>
  ${wrong.length ? `<a class="row" href="#/q/review" style="--ac:var(--red)"><span><b>間違えた問題を復習</b><br><small class="sub">全科目から、間違えたままの問題だけ</small></span><span class="d" style="color:var(--red)">${wrong.length}問 ›</span></a>` : ''}

  ${arc.length ? `<details style="margin-top:12px"><summary>アーカイブした科目の問題（${arc.length}科目）</summary>${arc.map(qrow).join('')}</details>` : ''}`);
}

function dataOf(q) {
  const a = JSON.parse(q.answer);
  if (q.kind === 'single' || q.kind === 'multi') return q.choices.map((c, k) => (a.includes(k) ? '*' : '') + c).join('\n');
  if (q.kind === 'tf') return a;
  if (q.kind === 'order') return q.choices.join('\n');
  if (q.kind === 'match') return q.choices.map(x => x.join('＝')).join('\n');
  if (q.kind === 'word') return a.join('\n');
  return '';
}

function setupView(key, s, review) {
  const pool = review ? st.qs.filter(q => liveQ(q) && isWrong(q)) : st.qs.filter(q => q.subject_id === +key);
  if (!pool.length) return shell(`<h1>${esc(s.name)}</h1><p class="empty">${review ? '間違えたままの問題はありません。' : 'まだ問題がありません。'}</p>${review ? '' : '<button class="btn" data-act="newq">問題を作る</button>'}`, 'q');
  const units = [...new Set(pool.map(q => q.unit).filter(Boolean))];
  const kinds = [...new Set(pool.map(q => q.kind))];

    ${kinds.length > 1 ? `<label for="sk">形式</label><select id="sk" name="kind"><option value="">すべて</option>${kinds.map(k => `<option value="${k}">${KINDS[k][0]}</option>`).join('')}</select>` : ''}

}

      <div class="opts">${play.shuf.map((o, k) => p.includes(k) ? '' : `<button class="opt" data-act="opick" data-id="${k}" ${r ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>

    ${!r.ok && (q.kind === 'fill' || q.kind === 'word') ? '<button class="chip" data-act="selfok" style="margin-bottom:10px">自分の答えも合っていた（正解にする）</button>' : ''}
    ${q.explanation ? `<p class="sub">${esc(q.explanation)}</p>` : ''}
    <p class="sub">${rt ? `クラスの正答率 ${rt.p}%（${rt.n}回）` : 'クラスの正答率：まだ集計がありません'}</p>
    ${play.repOpen ? `<form id="repF" class="cmf" style="margin-bottom:10px"><input type="hidden" name="qid" value="${q.id}"><input name="body" required placeholder="例：答えが違うかも／別解あり" aria-label="報告の内容"><button class="chip">送る</button></form>` : `<button class="chip" data-act="rep" style="margin-bottom:10px">問題の間違いを報告</button>`}
    <button class="btn" data-act="next" style="margin-bottom:12px">${i + 1 < list.length ? '次へ' : '結果を見る'}</button></section>` : '';
  shell(head + body + res, 'q');
}

async function doAuth(d) {
  const uid = d.uid.trim().toLowerCase();
  if (!/^[a-z0-9_]{3,20}$/.test(uid)) throw new Error('ユーザーIDは半角英数字とアンダースコアで3〜20文字にしてください');
  const email = uid + '@classapp.example.com';
  if (authMode === 'reg') {
    const r = await sb.auth.signUp({ email, password: d.pw, options: { data: { display_name: d.name.trim() || uid, invite_code: d.code.trim() } } });
    if (r.error) throw new Error('登録できませんでした。招待コードが正しいか、IDが使われていないか確認してください');
  } else {
    const r = await sb.auth.signInWithPassword({ email, password: d.pw });
    if (r.error) throw new Error('IDまたはパスワードが違います');
  }
  await boot();
}

app.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, d = Object.fromEntries(new FormData(f));
  try {
    if (f.id === 'auth') return await doAuth(d);
    if (f.id === 'editTip') {
      const r = await sb.from('tips').update({ title: d.title.trim() || null, body: d.body.trim(), source: d.source, unit: d.unit.trim() || null }).eq('id', +d.tid).select();
      if (r.error) throw r.error;
      if (!r.data.length) throw new Error('編集できませんでした。自分の投稿か確認してください');
      editId = null;
    }
    if (f.id === 'ansF') { judge(d); return route(); }
    if (f.id === 'addCm') {
      const r = await sb.from('comments').insert({ tip_id: +d.tid, body: d.body.trim() });
      if (r.error) throw r.error;
    }
    if (f.id === 'addQ') {
      const pq = parseQ(d.kind, d.body, d.data || '');
      if (d.kind === 'fill' && d.anyorder) pq.choices = { anyOrder: true };
      const row = { subject_id: +d.sid, tip_id: d.tip ? +d.tip : null, kind: d.kind, body: d.body.trim(), choices: pq.choices, answer: JSON.stringify(pq.answer), explanation: d.exp.trim() || null, unit: d.unit.trim() || null };
      const img = await upImg(d.img);
      if (img) row.image_path = img; else if (d.rmimg) row.image_path = null;
      const r = d.qid ? await sb.from('questions').update(row).eq('id', +d.qid).select() : await sb.from('questions').insert(row).select();
      if (r.error) throw r.error;
      if (!r.data.length) throw new Error('保存できませんでした。自分の問題か確認してください');
      qFromTip = null; qEditId = null; play = null; await load(); location.hash = '#/q/' + d.sid; toast(d.qid ? '問題を保存しました' : '問題を作りました', true); return;
    }
    if (f.id === 'setupF') {
      const review = d.key === 'review';
      let pool = review ? st.qs.filter(q => liveQ(q) && isWrong(q)) : st.qs.filter(q => q.subject_id === +d.key);
      if (d.scope === 'wrong') pool = pool.filter(isWrong);
      if (d.scope === 'new') pool = pool.filter(q => !lastAtt(q.id));
      if (d.unit) pool = pool.filter(q => q.unit === d.unit);
      if (d.kind) pool = pool.filter(q => q.kind === d.kind);
      if (!pool.length) throw new Error('条件に合う問題がありません');
      pool = shuf(pool); if (d.n !== 'all') pool = pool.slice(0, +d.n);
      play = { key: d.key, list: pool, i: 0, score: 0, res: null, pick: [], miss: [] };
      route(); return window.scrollTo(0, 0);
    }
    if (f.id === 'repF') {
      const r = await sb.from('question_reports').insert({ question_id: +d.qid, body: d.body.trim() });
      if (r.error) throw r.error;
      play.repOpen = false; toast('報告を送りました。作った人に届きます', true);
      st.rep.push({ id: 0, question_id: +d.qid, body: d.body.trim(), reporter_id: me.id, created_at: new Date().toISOString(), profiles: { display_name: me.display_name } });
      return route();
    }
    if (f.id === 'homeSearch') { searchQ = d.q || ''; location.hash = '#/search'; return; }
    if (f.id === 'addSubject') {
      const r = await sb.from('subjects').insert({ name: d.name.trim(), exam_date: d.exam_date || null, exam_period: d.exam_period ? +d.exam_period : null });
      if (r.error) throw r.error;
    } else if (f.id === 'addTip') {
      const image_path = await upImg(d.img);
      const r = await sb.from('tips').insert({ subject_id: +d.sid, title: d.title.trim(), body: d.body.trim(), source: d.source, unit: d.unit.trim() || null, image_path });
      if (r.error) throw r.error;
      lastSource = d.source;
      writeSid = +d.sid; await load(); location.hash = '#/s/' + d.sid; return;
    }
    await load(); route();
  } catch (err) { toast(err.message); }
});

app.addEventListener('change', async e => {
  if (e.target.id !== 'examDate' && e.target.id !== 'examPer') return;
  try {
    const v = e.target.value || null;
    const r = await sb.from('subjects').update(e.target.id === 'examDate' ? { exam_date: v } : { exam_period: v ? +v : null }).eq('id', +e.target.dataset.sid);
    if (r.error) throw r.error;
    await load(); route();
  } catch (err) { toast(err.message); }
});

app.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act, id = +b.dataset.id;
  try {
    if (a === 'mode') { authMode = authMode === 'login' ? 'reg' : 'login'; return route(); }
    if (a === 'push') return await togglePush();
    if (a === 'testpush') return await testPush();
    if (a === 'out') {
      try { if (pushOn) { const reg = await navigator.serviceWorker.ready, s = await reg.pushManager.getSubscription(); if (s) { await sb.rpc('delete_push', { p_endpoint: s.endpoint }); await s.unsubscribe(); } pushOn = false; } } catch (_) {}
      await sb.auth.signOut(); me = null; return route();
    }
    if (a === 'towrite') { writeSid = id; location.hash = '#/write'; return; }
    if (a === 'edit') { editId = id; route(); const e = document.getElementById('et'); if (e) { e.scrollIntoView({ block: 'center' }); e.focus({ preventScroll: true }); } return; }
    if (a === 'cancel') { editId = null; return route(); }
    if (a === 'cm') { openTip = openTip === id ? null : id; return route(); }
    if (a === 'mkq') { qFromTip = id; qEditId = null; location.hash = '#/qnew'; return; }
    if (a === 'pick') {
      const q = play.list[play.i];
      if (q.kind === 'multi') play.pick = play.pick.includes(id) ? play.pick.filter(k => k !== id) : [...play.pick, id];
      else { play.pick = [id]; judge({}); }
      return route();
    }
    if (a === 'check') { judge({}); return route(); }
    if (a === 'selfok') {
      if (play.res && !play.res.ok) {
        play.res.ok = true; play.score++; play.miss = play.miss.filter(x => x !== play.list[play.i]);
        if (play.attId) { await sb.from('attempts').update({ correct: true }).eq('id', play.attId); const at = st.att.find(x => x.id === play.attId); if (at) at.correct = true; }
      }
      return route();
    }
    if (a === 'rep') { play.repOpen = true; route(); const e = document.querySelector('#repF input[name=body]'); if (e) e.focus(); return; }
    if (a === 'newq') { qEditId = null; qFromTip = null; location.hash = '#/qnew'; return; }
    if (a === 'editq') { qEditId = id; qFromTip = null; if (location.hash === '#/qnew') route(); else location.hash = '#/qnew'; return; }
    if (a === 'retrymiss') { play = { key: b.dataset.key, list: shuf(lastMiss), i: 0, score: 0, res: null, pick: [], miss: [] }; route(); return window.scrollTo(0, 0); }
    if (a === 'opick') { play.pick.push(id); return route(); }
    if (a === 'oreset') { play.pick = []; return route(); }
    if (a === 'next') { Object.assign(play, { i: play.i + 1, res: null, pick: [], shuf: null, rs: null, perm: null, repOpen: false, attId: null }); route(); return window.scrollTo(0, 0); }
    if (a === 'unit') { unitF = b.dataset.u; return route(); }
    if (a === 'sort') { sortBy = sortBy === 'conf' ? 'new' : 'conf'; return route(); }
    let r;
    if (a === 'conf') {
      const mine = st.conf.some(c => c.tip_id === id && c.user_id === me.id);
      r = mine ? await sb.from('tip_confirmations').delete().match({ tip_id: id, user_id: me.id }) : await sb.from('tip_confirmations').insert({ tip_id: id });
    } else if (a === 'delcm') {
      r = await sb.from('comments').delete().eq('id', id);
    } else if (a === 'delq') {
      if (!confirm('この問題を削除しますか？')) return;
      r = await sb.from('questions').delete().eq('id', id);
      play = null; qEditId = null; if (location.hash === '#/qnew') location.hash = '#/q';
    } else if (a === 'delrep') {
      r = await sb.from('question_reports').delete().eq('id', id);
    } else if (a === 'fix') {
      r = await sb.rpc('toggle_correction', { p_tip_id: id });
    } else if (a === 'del') {
      if (!confirm('この投稿を削除しますか？')) return;
      r = await sb.from('tips').delete().eq('id', id);
    } else if (a === 'arc') {
      const sub = st.subjects.find(x => x.id === id);
      r = await sb.from('subjects').update({ archived: !sub.archived }).eq('id', id).select();
      if (!r.error && !r.data.length) throw new Error('変更できませんでした。科目を作った人か管理者だけが変更できます');
      if (!r.error) toast(sub.archived ? 'アーカイブから戻しました' : 'アーカイブしました', true);
    } else if (a === 'arcall') {
      const ids = st.subjects.filter(x => !x.archived && x.exam_date && daysLeft(x.exam_date) < 0 && (x.created_by === me.id || me.is_admin)).map(x => x.id);
      if (!confirm(`終了した${ids.length}科目をアーカイブしますか？（あとから戻せます）`)) return;
      r = await sb.from('subjects').update({ archived: true }).in('id', ids);
      if (!r.error) toast(`${ids.length}科目をアーカイブしました`, true);
    } else if (a === 'delsub') {
      const n = st.tips.filter(t => t.subject_id === id).length;
      if (!confirm(n ? `この科目と、中の投稿${n}件をすべて削除しますか？元に戻せません。` : 'この科目を削除しますか？')) return;
      r = await sb.from('subjects').delete().eq('id', id).select();
      if (!r.error && !r.data.length) throw new Error('削除できませんでした。他の人の投稿がある科目は、管理者だけが削除できます');
      location.hash = '#/';
    }
    if (r && r.error) throw r.error;
    await load(); route();
  } catch (err) { toast(err.message); }
});

app.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  searchQ = e.target.value;
  const el = document.getElementById('res'); if (el) el.innerHTML = searchResults();
});

app.addEventListener('change', e => { if (e.target.id === 'qk') { document.getElementById('qh').textContent = KINDS[e.target.value][1]; document.getElementById('aoBox').style.display = e.target.value === 'fill' ? 'flex' : 'none'; } });

// 指が触れたときの拡大・縮小を防ぐ（iPhone対策）
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
// 画像はタップで大きく表示
const zoom = document.getElementById('zoom');
app.addEventListener('click', e => {
  const im = e.target.closest('img.pic');
  if (!im || !im.src) return;
  zoom.querySelector('img').src = im.src; zoom.classList.add('on');
});
zoom.addEventListener('click', () => zoom.classList.remove('on'));

boot();
</script>
</body>
</html>
