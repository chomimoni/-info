<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>でるとこ</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="でるとこ">
<meta name="theme-color" content="#14232E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F7;--ink:#14232E;--sub:#5B6B77;--line:#D3DCE2;--card:#fff;--hl:#F6D04D;--teal:#0F6E78;--red:#B8381F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.7 "Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif}
header{background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header a,header button{color:#fff;background:none;border:0;font:inherit;font-weight:700;text-decoration:none;padding:6px 0;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
h1,h2,h3{line-height:1.3;margin:0}
h2{font-size:18px;font-weight:900;margin:28px 0 10px}
.hero{display:block;background:var(--ink);color:#fff;border-radius:14px;padding:22px 20px;text-decoration:none;margin-bottom:12px}
.hero .big{font-size:56px;font-weight:900;line-height:1.1;color:var(--hl)}
.hero .nm{font-weight:700;margin-top:4px}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;color:inherit;text-decoration:none;font-weight:700}
.row .d{color:var(--teal);font-weight:900}
.row .d.off{color:var(--sub);font-weight:500}
.tip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.tip.fix{border-color:var(--red)}
.tip .flag{margin:0 0 6px;color:var(--red);font-weight:700;font-size:14px}
.tip .body{margin:0 0 8px;font-size:17px}
mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--sub);font-size:13px;margin:0 0 10px}
.meta a{color:var(--teal)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
button,select,input,textarea{font:inherit}
.acts button,.chip,.btn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-weight:700;cursor:pointer}
.acts .cf.on{background:var(--teal);border-color:var(--teal);color:#fff}
.btn{background:var(--ink);border-color:var(--ink);color:#fff;width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chip{white-space:nowrap;min-height:38px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
form.card,details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
summary{font-weight:700;cursor:pointer;min-height:28px}
label{display:block;font-size:14px;font-weight:700;margin:10px 0 4px}
input,select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:84px}
.sub{color:var(--sub);font-size:14px}
.empty{color:var(--sub);padding:16px 4px}
.auth{max-width:420px;margin:0 auto;padding:48px 16px}
.auth h1{font-size:40px;font-weight:900;margin-bottom:4px}
.link{background:none;border:0;color:var(--teal);font-weight:700;text-decoration:underline;margin-top:12px;cursor:pointer;min-height:44px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--red);color:#fff;border-radius:10px;padding:12px 14px;font-weight:700;display:none;z-index:9}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="alert"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ▼ Supabaseの「Project Settings → API」にある値に書き換えてください
const SB_URL = 'https://eejbkxvhoerlvdekdced.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlamJreHZob2VybHZkZWtkY2VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyMjk4OTYsImV4cCI6MjEwOTgwNTg5Nn0.JaPKca7QH4KR2GsZ8xYXPyxWlyOOJmYb8OFKK5LNF30';
// ▲

const sb = supabase.createClient(SB_URL, SB_KEY);
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null, authMode = 'login', unitF = '', sortBy = 'new', lastSource = '先生の発言';
let st = { subjects: [], tips: [], conf: [] };

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 4000);
}
function daysLeft(d) {
  if (!d) return null;
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.round((new Date(d + 'T00:00:00') - t) / 864e5);
}
const fmt = s => new Date(s).toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' });

async function load() {
  const [a, b, c] = await Promise.all([
    sb.from('subjects').select('*').order('name'),
    sb.from('tips').select('*, profiles(display_name)').order('created_at', { ascending: false }),
    sb.from('tip_confirmations').select('*')
  ]);
  const err = a.error || b.error || c.error;
  if (err) throw err;
  st = { subjects: a.data, tips: b.data, conf: c.data };
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { me = null; return route(); }
  const { data: p } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if (!p) { me = null; toast('アカウント情報が見つかりません。もう一度ログインしてください'); return route(); }
  me = p;
  try { await load(); } catch (e) { toast(e.message); }
  route();
}

function route() {
  if (!me) return authView();
  const h = location.hash.slice(2);
  if (h.startsWith('s/')) return subjectView(+h.slice(2));
  homeView();
}
window.addEventListener('hashchange', () => { unitF = ''; route(); });

function shell(inner, back) {
  app.innerHTML = `<header>${back ? '<a href="#/">← 科目一覧</a>' : '<strong>でるとこ</strong>'}<button data-act="out">ログアウト</button></header><main>${inner}</main>`;
  window.scrollTo(0, 0);
}

function authView() {
  const reg = authMode === 'reg';
  app.innerHTML = `<div class="auth"><h1>でるとこ</h1><p class="sub">クラスの試験情報をみんなで集める場所</p>
  <form id="auth" class="card">
    <label for="uid">ユーザーID（半角英数字）</label><input id="uid" name="uid" autocomplete="username" autocapitalize="none" required>
    ${reg ? '<label for="nm">表示名（掲示板に出る名前）</label><input id="nm" name="name" required>' : ''}
    <label for="pw">パスワード（6文字以上）</label><input id="pw" name="pw" type="password" minlength="6" autocomplete="${reg ? 'new-password' : 'current-password'}" required>
    ${reg ? '<label for="cd">招待コード</label><input id="cd" name="code" autocapitalize="none" required>' : ''}
    <div style="margin-top:16px"><button class="btn">${reg ? '登録する' : 'ログイン'}</button></div>
  </form>
  <button class="link" data-act="mode">${reg ? 'アカウントがある人はログイン' : '初めての人は登録'}</button></div>`;
}

function homeView() {
  const subs = st.subjects.map(s => ({ ...s, d: daysLeft(s.exam_date) }));
  const up = subs.filter(s => s.d !== null && s.d >= 0).sort((a, b) => a.d - b.d);
  const none = subs.filter(s => s.d === null);
  const past = subs.filter(s => s.d !== null && s.d < 0);
  const lab = s => s.d === null ? '<span class="d off">試験日未設定</span>' : s.d < 0 ? '<span class="d off">終了</span>' : `<span class="d">あと${s.d}日</span>`;
  const row = s => `<a class="row" href="#/s/${s.id}"><span>${esc(s.name)}</span>${lab(s)}</a>`;
  const first = up[0];
  const hero = first ? `<a class="hero" href="#/s/${first.id}"><div class="big">${first.d === 0 ? '今日' : 'あと' + first.d + '日'}</div><div class="nm">${esc(first.name)}の試験</div></a>` : '';
  const subName = id => (st.subjects.find(s => s.id === id) || {}).name || '';
  const recent = st.tips.slice(0, 5).map(t => `<article class="tip"><p class="body"><mark>${esc(t.body)}</mark></p><p class="meta"><a href="#/s/${t.subject_id}">${esc(subName(t.subject_id))}</a><span>${esc(t.profiles?.display_name)}</span><span>${fmt(t.created_at)}</span></p></article>`).join('');
  shell(`${hero}${up.slice(1).concat(none, past).map(row).join('')}
  ${subs.length ? '' : '<p class="empty">まず科目を追加しましょう。例：解剖生理II</p>'}
  <details ${subs.length ? '' : 'open'}><summary>科目を追加する</summary>
    <form id="addSubject"><label for="sn">科目名</label><input id="sn" name="name" required>
    <label for="sd">試験日（あとから変更できます）</label><input id="sd" name="exam_date" type="date">
    <div style="margin-top:14px"><button class="btn">追加する</button></div></form></details>
  <h2>新しいでるとこ</h2>${recent || '<p class="empty">まだ投稿がありません。科目を開いて最初の1件を書いてみましょう。</p>'}`);
}

function tipHTML(t) {
  const n = st.conf.filter(c => c.tip_id === t.id).length;
  const mine = st.conf.some(c => c.tip_id === t.id && c.user_id === me.id);
  const can = t.author_id === me.id || me.is_admin;
  return `<article class="tip ${t.needs_correction ? 'fix' : ''}">
    ${t.needs_correction ? '<p class="flag">訂正あり：範囲が変わった可能性があります</p>' : ''}
    <p class="body"><mark>${esc(t.body)}</mark></p>
    <p class="meta"><span>${esc(t.source)}</span>${t.unit ? `<span>${esc(t.unit)}</span>` : ''}<span>${esc(t.profiles?.display_name)}</span><span>${fmt(t.created_at)}</span></p>
    <div class="acts">
      <button class="cf ${mine ? 'on' : ''}" data-act="conf" data-id="${t.id}">${mine ? '確認済み' : '確認した'} ${n}</button>
      <button data-act="fix" data-id="${t.id}">${t.needs_correction ? '訂正を取り消す' : '訂正あり'}</button>
      ${can ? `<button data-act="del" data-id="${t.id}">削除</button>` : ''}
    </div></article>`;
}

function subjectView(id) {
  const s = st.subjects.find(x => x.id === id);
  if (!s) { location.hash = '#/'; return; }
  const tips = st.tips.filter(t => t.subject_id === id);
  const units = [...new Set(tips.map(t => t.unit).filter(Boolean))];
  const cnt = t => st.conf.filter(c => c.tip_id === t.id).length;
  let list = unitF ? tips.filter(t => t.unit === unitF) : tips.slice();
  if (sortBy === 'conf') list.sort((a, b) => cnt(b) - cnt(a));
  const d = daysLeft(s.exam_date);
  const dl = d === null ? '試験日未設定' : d < 0 ? '試験は終了しました' : d === 0 ? '試験は今日です' : `試験まであと${d}日`;
  const opts = ['先生の発言', '資料', '過去問', 'その他'].map(o => `<option ${o === lastSource ? 'selected' : ''}>${o}</option>`).join('');
  shell(`<h1>${esc(s.name)}</h1><p class="sub">${dl}</p>
  <label for="examDate">試験日</label><input id="examDate" type="date" value="${s.exam_date || ''}" data-sid="${s.id}">
  <h2>でるところを書く</h2>
  <form id="addTip" class="card"><input type="hidden" name="sid" value="${s.id}">
    <label for="tb">内容（一言でOK）</label><textarea id="tb" name="body" required></textarea>
    <label for="ts">情報源</label><select id="ts" name="source">${opts}</select>
    <label for="tu">単元（任意）</label><input id="tu" name="unit" list="ul" placeholder="例：骨盤">
    <datalist id="ul">${units.map(u => `<option value="${esc(u)}">`).join('')}</datalist>
    <div style="margin-top:14px"><button class="btn">投稿する</button></div></form>
  <h2>みんなのでるとこ</h2>
  <div class="chips">
    <button class="chip ${unitF ? '' : 'on'}" data-act="unit" data-u="">すべて</button>
    ${units.map(u => `<button class="chip ${unitF === u ? 'on' : ''}" data-act="unit" data-u="${esc(u)}">${esc(u)}</button>`).join('')}
    <button class="chip" data-act="sort">${sortBy === 'conf' ? '並び：確認が多い順' : '並び：新しい順'}</button>
  </div>
  ${list.map(tipHTML).join('') || '<p class="empty">まだ投稿がありません。最初の1件を書いてみましょう。</p>'}`, true);
}

async function doAuth(d) {
  const uid = d.uid.trim().toLowerCase();
  if (!/^[a-z0-9_]{3,20}$/.test(uid)) throw new Error('ユーザーIDは半角英数字とアンダースコアで3〜20文字にしてください');
  const email = uid + '@classapp.example.com';
  if (authMode === 'reg') {
    const r = await sb.auth.signUp({ email, password: d.pw, options: { data: { display_name: d.name.trim() || uid, invite_code: d.code.trim() } } });
    if (r.error) throw new Error('登録できませんでした。招待コードが正しいか、IDが使われていないか確認してください');
  } else {
    const r = await sb.auth.signInWithPassword({ email, password: d.pw });
    if (r.error) throw new Error('IDまたはパスワードが違います');
  }
  await boot();
}

app.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, d = Object.fromEntries(new FormData(f));
  try {
    if (f.id === 'auth') return await doAuth(d);
    if (f.id === 'addSubject') {
      const r = await sb.from('subjects').insert({ name: d.name.trim(), exam_date: d.exam_date || null });
      if (r.error) throw r.error;
    } else if (f.id === 'addTip') {
      const r = await sb.from('tips').insert({ subject_id: +d.sid, body: d.body.trim(), source: d.source, unit: d.unit.trim() || null });
      if (r.error) throw r.error;
      lastSource = d.source;
    }
    await load(); route();
  } catch (err) { toast(err.message); }
});

app.addEventListener('change', async e => {
  if (e.target.id !== 'examDate') return;
  try {
    const r = await sb.from('subjects').update({ exam_date: e.target.value || null }).eq('id', +e.target.dataset.sid);
    if (r.error) throw r.error;
    await load(); route();
  } catch (err) { toast(err.message); }
});

app.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act, id = +b.dataset.id;
  try {
    if (a === 'mode') { authMode = authMode === 'login' ? 'reg' : 'login'; return route(); }
    if (a === 'out') { await sb.auth.signOut(); me = null; return route(); }
    if (a === 'unit') { unitF = b.dataset.u; return route(); }
    if (a === 'sort') { sortBy = sortBy === 'conf' ? 'new' : 'conf'; return route(); }
    let r;
    if (a === 'conf') {
      const mine = st.conf.some(c => c.tip_id === id && c.user_id === me.id);
      r = mine ? await sb.from('tip_confirmations').delete().match({ tip_id: id, user_id: me.id }) : await sb.from('tip_confirmations').insert({ tip_id: id });
    } else if (a === 'fix') {
      r = await sb.rpc('toggle_correction', { p_tip_id: id });
    } else if (a === 'del') {
      if (!confirm('この投稿を削除しますか？')) return;
      r = await sb.from('tips').delete().eq('id', id);
    }
    if (r && r.error) throw r.error;
    await load(); route();
  } catch (err) { toast(err.message); }
});

boot();
</script>
</body>
</html>
